name: Daily job alerts

on: workflow_dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-job-alerts
  cancel-in-progress: false

jobs:
  send-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore job history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
                    artifact_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?name=job-history&per_page=100" \
            --paginate --slurp \
            | jq -r '[.[].artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$artifact_id" ]; then
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              > history.zip
            unzip -o history.zip job-history.json -d data
          else
            echo "No previous history. This run will create a baseline."
          fi
      - name: Send daily alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_USER_ID: ${{ secrets.OWNER_USER_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/daily_jobs.py

      - name: Save job history
        if: ${{ always() && hashFiles('data/job-history.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: job-history
          path: data/job-history.json
          retention-days: 90
          if-no-files-found: error